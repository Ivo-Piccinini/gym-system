<div class="time-field">
  <input
    [id]="inputId()"
    type="text"
    inputmode="numeric"
    maxlength="2"
    autocomplete="off"
    placeholder="HH"
    class="form-input hour-input"
    [class.input-invalid]="invalid()"
    [value]="hour()"
    [disabled]="disabled()"
    (input)="onHourInput($event)"
    (blur)="onHourBlur()"
    (keydown.arrowup)="stepHour(1, $event)"
    (keydown.arrowdown)="stepHour(-1, $event)"
    aria-label="Hora, de 0 a 23"
  />
  <span class="time-sep" aria-hidden="true">:</span>
  <div class="minute-chips" role="group" aria-label="Minutos">
    @for (m of minuteOptions(); track m) {
      <button
        type="button"
        class="minute-chip"
        [class.active]="minute() === m"
        [disabled]="disabled()"
        (click)="setMinute(m)"
      >
        {{ m }}
      </button>
    }
  </div>
</div>
