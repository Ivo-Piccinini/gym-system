<div class="shell-container">
  <header class="shell-header">
    <div class="brand-group">
      <div class="brand-logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="shellAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24" />
              <stop offset="100%" stop-color="#d97706" />
            </linearGradient>
            <linearGradient id="shellSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f8fafc" />
              <stop offset="100%" stop-color="#64748b" />
            </linearGradient>
          </defs>
          <rect x="18" y="29" width="28" height="6" rx="2" fill="url(#shellSteelGrad)" />
          <rect x="15" y="26" width="3" height="12" rx="1" fill="url(#shellAmberGrad)" />
          <rect x="46" y="26" width="3" height="12" rx="1" fill="url(#shellAmberGrad)" />
          <rect x="10" y="16" width="5" height="32" rx="1.5" fill="url(#shellSteelGrad)" />
          <rect x="49" y="16" width="5" height="32" rx="1.5" fill="url(#shellSteelGrad)" />
          <rect x="5" y="21" width="5" height="22" rx="1.5" fill="url(#shellAmberGrad)" />
          <rect x="54" y="21" width="5" height="22" rx="1.5" fill="url(#shellAmberGrad)" />
        </svg>
      </div>
      <div class="brand-info">
        <span class="brand-name">Gym System</span>
        <span class="brand-badge">{{ getRoleDisplayName() }}</span>
      </div>
    </div>

    <button
      type="button"
      class="nav-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Alternar navegación"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (menuOpen()) {
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        } @else {
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        }
      </svg>
    </button>

    <nav class="shell-nav" [class.nav-open]="menuOpen()">
      <a routerLink="/perfil" routerLinkActive="active-link" (click)="closeMenu()" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Mi Perfil</span>
      </a>

      <a routerLink="/clases" routerLinkActive="active-link" (click)="closeMenu()" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        <span>Clases</span>
      </a>

      @if (authService.isClient() || authService.isAdmin()) {
        <a routerLink="/membresias" routerLinkActive="active-link" (click)="closeMenu()" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
          </svg>
          <span>Membresías</span>
        </a>

        <a routerLink="/pagos" routerLinkActive="active-link" (click)="closeMenu()" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
          <span>Pagos</span>
        </a>
      }

      @if (authService.isAdmin()) {
        <a routerLink="/admin/usuarios" routerLinkActive="active-link" (click)="closeMenu()" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Padrón de Usuarios</span>
        </a>
      }

      <div class="user-action-group">
        @if (authService.username()) {
          <span class="user-name-tag">&#64;{{ authService.username() }}</span>
        }
        <button type="button" class="btn-logout" (click)="onLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
