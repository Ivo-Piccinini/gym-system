<header class="app-navbar">
  <div class="navbar-brand">
    <div class="brand-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="nbAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
          </linearGradient>
          <linearGradient id="nbSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
        </defs>
        <rect x="18" y="29" width="28" height="6" rx="2" fill="url(#nbSteelGrad)" />
        <rect x="15" y="26" width="3" height="12" rx="1" fill="url(#nbAmberGrad)" />
        <rect x="46" y="26" width="3" height="12" rx="1" fill="url(#nbAmberGrad)" />
        <rect x="10" y="16" width="5" height="32" rx="1.5" fill="url(#nbSteelGrad)" />
        <rect x="49" y="16" width="5" height="32" rx="1.5" fill="url(#nbSteelGrad)" />
        <rect x="5" y="21" width="5" height="22" rx="1.5" fill="url(#nbAmberGrad)" />
        <rect x="54" y="21" width="5" height="22" rx="1.5" fill="url(#nbAmberGrad)" />
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-title">Gym System</span>
      <span class="brand-subtitle">{{ roleDisplayName() }}</span>
    </div>
  </div>

  <nav class="navbar-actions">
    <!-- ADMINISTRADOR -->
    @if (isAdmin()) {
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="btn-ghost" title="Métricas y Auditoría">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <span>Métricas</span>
      </a>

      <a routerLink="/admin/usuarios" routerLinkActive="active" class="btn-ghost" title="Padrón de Usuarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>Padrón</span>
      </a>

      <a routerLink="/admin/planes" routerLinkActive="active" class="btn-ghost" title="Gestión de Planes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="2" />
          <line x1="2" y1="10" x2="22" y2="10" />
        </svg>
        <span>Planes</span>
      </a>
    }

    <!-- CLASES (Todos los roles) -->
    <a routerLink="/clases" routerLinkActive="active" class="btn-ghost" title="Clases Disponibles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span>Clases</span>
    </a>

    <!-- MI RUTINA (Solo Socio) -->
    @if (isClient()) {
      <a routerLink="/mi-rutina" routerLinkActive="active" class="btn-ghost" title="Mi Rutina de Entrenamiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 6.5h11" />
          <path d="M6.5 17.5h11" />
          <path d="M3 9v6" />
          <path d="M21 9v6" />
          <path d="M6 7v10" />
          <path d="M18 7v10" />
        </svg>
        <span>Mi Rutina</span>
      </a>
    }

    <!-- RUTINAS (Profesor y Administrador) -->
    @if (isProfessor() || isAdmin()) {
      <a routerLink="/profesor/rutinas" routerLinkActive="active" class="btn-ghost" title="Gestión de Rutinas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 6.5h11" />
          <path d="M6.5 17.5h11" />
          <path d="M3 9v6" />
          <path d="M21 9v6" />
          <path d="M6 7v10" />
          <path d="M18 7v10" />
        </svg>
        <span>Rutinas</span>
      </a>
    }

   

    <!-- MEMBRESÍAS (Socio y Administrador) -->
    @if (isClient() || isAdmin()) {
      <a routerLink="/membresias" routerLinkActive="active" class="btn-ghost" title="Membresías">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="2" />
          <line x1="2" y1="10" x2="22" y2="10" />
        </svg>
        <span>Membresías</span>
      </a>
    }

    <!-- MIS PAGOS (Solo Socio) -->
    @if (isClient()) {
      <a routerLink="/pagos" routerLinkActive="active" class="btn-ghost" title="Historial de Pagos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
          <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
          <path d="M12 17.5v-11" />
        </svg>
        <span>Pagos</span>
      </a>
    }

    <!-- MI PERFIL (Todos los roles) -->
    <a routerLink="/perfil" routerLinkActive="active" class="btn-ghost" title="Mi Perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>Mi Perfil</span>
    </a>

    <!-- CERRAR SESIÓN -->
    <button type="button" class="btn-ghost btn-logout" (click)="onLogout()" title="Cerrar Sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Salir</span>
    </button>
  </nav>
</header>
